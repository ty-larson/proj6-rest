services:
  laptop-service:
    build: ./laptop
    command: python -u api.py
    volumes:
      - ./laptop:/usr/src/app
    ports:
      - "5001:80"
    depends_on:
      - db

  website:
    image: php:apache
    volumes:
      - ./website:/var/www/html
    ports:
      - "5000:80"
    depends_on:
      - laptop-service

  brevets:
    build: ./brevets
    command: python -u app.py
    ports:
      - "5002:5000"
    volumes:
      - ./brevets:/todo
    depends_on:
      - db

  db:
    image: mongo:5.0